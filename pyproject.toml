[project]
name = "hulder"
version = "0.1.0"
description = "Release gate for thresholded scores, such as activation probes, across LLM serving configs"
readme = "docs/pypi.md"
authors = [
    { name = "Utku Özbek" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["activation probes", "llm", "vllm", "quantization", "release gate", "mlops", "monitoring"]
# No License :: classifier: PEP 639 forbids one alongside the license expression above.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
# Base install: the gate library and CLI, numpy and scipy only.
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
]

[project.urls]
Source = "https://github.com/revtheundead/hulder"
Issues = "https://github.com/revtheundead/hulder/issues"

[project.optional-dependencies]
# hulder.capture imports pyyaml and huggingface_hub itself; the floors are the versions
# uv.lock resolves under the vllm pin.
vllm = ["vllm==0.30.0", "pyyaml>=6.0.3", "huggingface-hub>=1.33.0"]
train = ["scikit-learn>=1.7"]

[dependency-groups]
# Default for `uv run`/`uv sync`, so local work keeps both extras installed.
dev = [
    {include-group = "test"},
    "hulder[vllm,train]",
    "pandas>=2.3",
    "pyarrow>=21",
    # Imported directly by experiments/; versions come from the vllm pin via uv.lock.
    "huggingface-hub",
    "torch",
]
# The fast suite and lint on the base install, as CI runs them.
test = ["pytest>=8", "ruff==0.16.10"]

[project.scripts]
hulder = "hulder.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Managed interpreter only (it ships Python.h, which Triton's JIT needs), never
# downloaded implicitly. scripts/dev-env.sh points UV_PYTHON_INSTALL_DIR into the repo.
python-preference = "only-managed"
python-downloads = "manual"

[tool.ruff]
# Matches the existing code; most lines stay within 120.
line-length = 120
