[project]
name = "hulder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Utku Özbek", email = "72575433+revtheundead@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "vllm==0.30.0",
]

[project.scripts]
hulder = "hulder:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Managed interpreter only (it ships Python.h, which Triton's JIT needs), never
# downloaded implicitly. scripts/dev-env.sh points UV_PYTHON_INSTALL_DIR into the repo.
python-preference = "only-managed"
python-downloads = "manual"
