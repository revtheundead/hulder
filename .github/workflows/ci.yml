# Lint and the fast suite on the base install, without the vllm extra. Tests that need
# vLLM, and the slow calibration runs, are opt-in and run locally (README §9.1).
name: CI

# Pushes to main only, so a branch with an open PR runs once, on pull_request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      # pyproject.toml forbids implicit downloads, so install the pinned .python-version explicitly.
      - run: uv python install
      - run: uv sync --locked --no-default-groups --group test
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest
