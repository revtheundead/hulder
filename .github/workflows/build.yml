# Release artefacts, built on GitHub's runners rather than a developer's machine, with their
# SHA-256s in the run log and in the artefact. Run by hand on the commit being released:
#   gh workflow run build.yml --ref main
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          enable-cache: false
      - run: uv python install
      - run: uv build --out-dir dist
      - name: Hash the artefacts
        working-directory: dist
        run: |
          sha256sum hulder-* | tee SHA256SUMS
          { echo "Commit $GITHUB_SHA"; echo '```'; cat SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
